<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Muttahida ERP - Setup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .container {
      width: 500px;
      text-align: center;
      -webkit-app-region: no-drag;
    }

    .logo {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 40px;
    }

    .mode-cards {
      display: flex;
      gap: 16px;
      margin-bottom: 30px;
    }

    .mode-card {
      flex: 1;
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 24px 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .mode-card:hover {
      border-color: #3b82f6;
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(59, 130, 246, 0.15);
    }

    .mode-card.selected {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.1);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
    }

    .mode-card.selected::after {
      content: '✓';
      position: absolute;
      top: 8px;
      left: 8px;
      width: 24px;
      height: 24px;
      background: #3b82f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: white;
    }

    .mode-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .mode-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f1f5f9;
    }

    .mode-desc {
      font-size: 0.78rem;
      color: #94a3b8;
      line-height: 1.6;
    }

    /* Server IP Input (shown only for client mode) */
    .server-ip-section {
      display: none;
      margin-bottom: 24px;
      animation: fadeIn 0.3s ease;
    }

    .server-ip-section.visible {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-group {
      text-align: right;
      margin-bottom: 8px;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 1rem;
      font-family: 'Cairo', sans-serif;
      text-align: center;
      direction: ltr;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
    }

    .input-group input::placeholder {
      color: #475569;
    }

    .input-hint {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 6px;
    }

    /* Start Button */
    .start-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      opacity: 0.5;
      pointer-events: none;
    }

    .start-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    .start-btn.active:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    /* Status */
    .status {
      display: none;
      margin-top: 20px;
      padding: 12px 20px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 10px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .status.visible {
      display: block;
    }

    .status.error {
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #3b82f6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">المتحدة ERP</div>
    <div class="subtitle">اختر وضع التشغيل لهذا الجهاز</div>

    <div class="mode-cards">
      <div class="mode-card" id="card-server" onclick="selectMode('server')">
        <div class="mode-icon">🖥️</div>
        <div class="mode-title">سيرفر (أساسي)</div>
        <div class="mode-desc">
          الجهاز اللي عليه قاعدة البيانات.<br>
          يشغّل السيرفر والواجهة معاً.
        </div>
      </div>
      <div class="mode-card" id="card-client" onclick="selectMode('client')">
        <div class="mode-icon">💻</div>
        <div class="mode-title">عميل (Client)</div>
        <div class="mode-desc">
          جهاز تاني على نفس الشبكة.<br>
          يتصل بالسيرفر الأساسي.
        </div>
      </div>
    </div>

    <div class="server-ip-section" id="server-ip-section">
      <div class="input-group">
        <label>عنوان IP السيرفر الأساسي</label>
        <input type="text" id="server-ip" placeholder="192.168.1.5" oninput="validateIp()">
        <div class="input-hint">اكتب عنوان الـ IP الخاص بالجهاز الأساسي (السيرفر)</div>
      </div>
    </div>

    <button class="start-btn" id="start-btn" onclick="startApp()">
      تشغيل
    </button>

    <div class="status" id="status"></div>
  </div>

  <script>
    let selectedMode = null;

    function selectMode(mode) {
      selectedMode = mode;
      document.getElementById('card-server').classList.toggle('selected', mode === 'server');
      document.getElementById('card-client').classList.toggle('selected', mode === 'client');
      
      const ipSection = document.getElementById('server-ip-section');
      const startBtn = document.getElementById('start-btn');
      
      if (mode === 'client') {
        ipSection.classList.add('visible');
        validateIp();
      } else {
        ipSection.classList.remove('visible');
        startBtn.classList.add('active');
      }
    }

    function validateIp() {
      const ip = document.getElementById('server-ip').value.trim();
      const startBtn = document.getElementById('start-btn');
      // Simple IP validation
      const ipRegex = /^(\d{1,3}\.){3}\d{1,3}$/;
      startBtn.classList.toggle('active', ipRegex.test(ip));
    }

    function startApp() {
      const startBtn = document.getElementById('start-btn');
      if (!startBtn.classList.contains('active')) return;

      const status = document.getElementById('status');
      status.classList.remove('error');
      status.classList.add('visible');

      if (selectedMode === 'server') {
        status.innerHTML = '<span class="spinner"></span> جاري تشغيل السيرفر...';
        // Send to Electron main process
        if (window.electronAPI) {
          window.electronAPI.startApp({ mode: 'server' });
        }
      } else {
        const ip = document.getElementById('server-ip').value.trim();
        status.innerHTML = '<span class="spinner"></span> جاري الاتصال بالسيرفر...';
        if (window.electronAPI) {
          window.electronAPI.startApp({ mode: 'client', serverIp: ip });
        }
      }

      startBtn.style.opacity = '0.5';
      startBtn.style.pointerEvents = 'none';
    }

    // Listen for errors from main process
    if (window.electronAPI) {
      window.electronAPI.onError((message) => {
        const status = document.getElementById('status');
        status.classList.add('visible', 'error');
        status.textContent = message;
        const startBtn = document.getElementById('start-btn');
        startBtn.style.opacity = '1';
        startBtn.style.pointerEvents = 'auto';
      });
    }
  </script>
</body>
</html>
