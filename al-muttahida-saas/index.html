<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="نظام إدارة متكامل لشركة المتحدة - ERP System" />
  <meta name="keywords" content="ERP, POS, مخزون, مبيعات, مشتريات, إدارة شركات" />
  <title>شركة المتحدة - نظام إدارة متكامل</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
  <link rel="icon" type="image/png" href="/icon.png?v=3" />
  <link rel="apple-touch-icon" href="/icon.png?v=3" />
  <link rel="preload" as="image" href="/company-logo-sm.jpg?v=3" />
  <style>
    /* Preload animation */
    #appLoader,
    #appLoader * {
      font-family: Tahoma, Arial, sans-serif !important;
      box-sizing: border-box !important;
    }
    .app-loader {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #0f1f4a 55%, #172959 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.2s ease-out;
      will-change: opacity;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    }
    .app-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }
    .loader-logo {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 38px -10px rgba(2, 6, 23, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #0f245c;
    }
    .loader-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .loader-brand {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
      line-height: 1.4;
    }
    .loader-status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(226, 232, 240, 0.92);
      font-size: 14px;
      font-weight: 400;
    }
    .loader-spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      will-change: transform;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <!-- Preloader -->
  <div class="app-loader" id="appLoader">
    <div class="loader-content">
      <div class="loader-logo">
        <img src="/company-logo-sm.jpg?v=3" alt="شركة المتحدة" width="76" height="76" decoding="sync" fetchpriority="high" />
      </div>
      <h1 class="loader-brand">شركة المتحدة</h1>
      <div class="loader-status">
        <div class="loader-spinner"></div>
        <span>جاري التحميل...</span>
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Hide loader smoothly as soon as app is ready
    window.addEventListener('load', function() {
      var loader = document.getElementById('appLoader');
      if (!loader) return;
      setTimeout(function() {
        loader.classList.add('hidden');
        setTimeout(function() {
          loader.style.display = 'none';
        }, 220);
      }, 150);
    });
  </script>
</body>

</html>
