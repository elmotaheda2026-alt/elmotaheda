<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="نظام إدارة متكامل لشركة المتحدة - ERP System" />
  <meta name="keywords" content="ERP, POS, مخزون, مبيعات, مشتريات, إدارة شركات" />
  <title>شركة المتحدة - نظام إدارة متكامل</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23667eea'/%3E%3Ctext x='50' y='60' font-family='Arial' font-size='40' fill='white' text-anchor='middle' font-weight='bold'%3Eم%3C/text%3E%3C/svg%3E" />
  <style>
    /* Preload animation */
    .app-loader {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .app-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <!-- Preloader -->
  <div class="app-loader" id="appLoader">
    <div style="text-align: center; color: white;">
      <div class="loader-spinner"></div>
      <p style="margin-top: 20px; font-size: 18px; font-weight: bold;">جاري التحميل...</p>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Hide loader when app is ready
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('appLoader').classList.add('hidden');
      }, 500);
    });
  </script>
</body>

</html>
